name: CI

# Every push and pull request: no Nintendo files, a 0-warning build, and both test projects.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: WW-Online.sln

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      # No submodules: the C# build only reads GameMod/src/puppet_link/puppet_shared.h
      # (PuppetLayout.targets). tww-decomp is reference material; nothing compiles against it.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: No Nintendo files
        shell: pwsh
        run: ./scripts/check-no-nintendo-files.ps1

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build (warnings are errors)
        run: dotnet build "${{ env.SOLUTION }}" -c Release --no-restore -warnaserror

      - name: Test client + server
        run: dotnet test WWOnline.Tests/WWOnline.Tests.csproj -c Release --no-build

      - name: Test patcher
        run: dotnet test WWOnline.Patcher.Tests/WWOnline.Patcher.Tests.csproj -c Release --no-build
