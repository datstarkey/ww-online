name: CI

# Every push and pull request: no Nintendo files, a 0-warning build, both test projects, the
# dedicated server's Docker image (built for amd64 and smoke-tested, never pushed), and the native game
# (libtww) built from seaborne/ on macOS the way the setup builds it, with no disc (never uploaded).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: WW-Online.sln

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      # No submodules: the C# build only reads GameMod/src/puppet_link/puppet_shared.h
      # (PuppetLayout.targets). tww-decomp is reference material; nothing compiles against it.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: No Nintendo files
        shell: pwsh
        run: ./scripts/check-no-nintendo-files.ps1

      # The wiki is built from docs/ (wiki.yml pushes it from main): a broken link fails here first.
      - name: Wiki builds, links resolve
        run: python scripts/build-wiki.py

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build (warnings are errors)
        run: dotnet build "${{ env.SOLUTION }}" -c Release --no-restore -warnaserror

      - name: Test client + server
        run: dotnet test WWOnline.Tests/WWOnline.Tests.csproj -c Release --no-build

      - name: Test patcher
        run: dotnet test WWOnline.Patcher.Tests/WWOnline.Patcher.Tests.csproj -c Release --no-build

  native-build:
    name: Native game (libtww from seaborne/, no disc)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The engine needs C++20's std::jthread (Aurora), which older Xcode versions' libc++ lacks.
      - name: Newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          clang++ --version
          printf '#include <thread>\nint main() { std::jthread t([] {}); }\n' | clang++ -std=c++20 -x c++ - -o /dev/null

      # Before anything is fetched or built, so it sees the vendored source alone.
      - name: No Nintendo data in seaborne/
        run: python3 seaborne/scripts/check-no-nintendo-data.py

      - name: Build tools
        run: brew install ninja

      # NativeBuild's steps (WWOnline.Client/Native/NativeBuild.cs), outside the source folder.
      - name: Fetch the audio sources (RecompCore)
        run: seaborne/native/tools/fetch_recompcore.sh "$RUNNER_TEMP/recompcore"

      - name: Configure
        run: cmake -S seaborne/native -B "$RUNNER_TEMP/libtww" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCOS_RECOMPCORE_DIR="$RUNNER_TEMP/recompcore"

      - name: Build libtww
        run: ninja -C "$RUNNER_TEMP/libtww" tww

      # The lib is discarded with the runner: no game binary ever leaves CI.
      - name: The embedding API is exported
        run: nm -gU "$RUNNER_TEMP/libtww/libtww.dylib" | grep -q ' _tww_api_version$'

  server-image:
    name: Server image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # amd64 only and loaded into the runner's Docker, not pushed. The release workflow builds
      # both architectures and pushes.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: WWOnline.Server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ww-online-server:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

      - name: Smoke test (/health, SignalR negotiate, healthy, graceful stop)
        shell: bash
        run: |
          docker run -d --name wwo -p 6969:6969 -e WWO_OWNER_KEY=ci-key ww-online-server:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6969/health && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:6969/health | grep -q '"status":"ok"'
          curl -fsS -X POST "http://127.0.0.1:6969/gamehub/negotiate?negotiateVersion=1" | grep -q connectionToken
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' wwo)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
          docker stop wwo
          docker logs wwo
          docker logs wwo 2>&1 | grep -q "Server stopped"
          [ "$(docker inspect -f '{{.State.ExitCode}}' wwo)" = 0 ]

      - name: Server log and health (on failure)
        if: failure()
        shell: bash
        run: |
          docker logs wwo || true
          docker inspect -f '{{json .State}}' wwo || true
